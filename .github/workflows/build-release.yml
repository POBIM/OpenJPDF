name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_NAME: OpenJPDF

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Get version from csproj
      id: get_version
      run: |
        $xml = [xml](Get-Content OpenJPDF.csproj)
        $version = $xml.Project.PropertyGroup.Version
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish (Self-contained)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./OpenJPDF-win-x64.zip
      shell: pwsh

    - name: Install Inno Setup
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (!(Test-Path $iscc)) {
          choco install innosetup --no-progress -y
        }
      shell: pwsh

    - name: Build Windows installer
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        & $iscc "/DMyAppVersion=${{ steps.get_version.outputs.VERSION }}" "/DPublishDir=..\publish" "installer\setup.iss"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      shell: pwsh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenJPDF-win-x64
        path: ./publish/
        retention-days: 30

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenJPDF-Setup-${{ steps.get_version.outputs.VERSION }}
        path: ./installer/output/OpenJPDF-Setup-${{ steps.get_version.outputs.VERSION }}.exe
        retention-days: 30

    - name: Create Release (on tag push only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## OpenJPDF - โปรแกรมแก้ไข PDF ฟรี
          
          โปรแกรมแก้ไข PDF ภาษาไทย พัฒนาเพื่อสังคมโดยไม่มีค่าใช้จ่าย
          
          ### ✨ คุณสมบัติหลัก
          - ✅ เปิด/ดู/แก้ไขไฟล์ PDF
          - ✅ เพิ่มข้อความ รูปภาพ รูปร่าง
          - ✅ รวม/แยก/หมุน/ลบหน้า PDF
          - ✅ เพิ่ม Header/Footer
          - ✅ รองรับ OCR ภาษาไทย-อังกฤษ
          - ✅ รองรับฟอนต์ภาษาไทยเต็มรูปแบบ
          
          ### 📥 วิธีติดตั้ง
          1. ดาวน์โหลด `OpenJPDF-Setup-${{ steps.get_version.outputs.VERSION }}.exe`
          2. เปิดตัวติดตั้งและทำตามขั้นตอนบนหน้าจอ

          หากต้องการแบบ portable ให้ดาวน์โหลด `OpenJPDF-win-x64.zip` แล้วเปิด `OpenJPDF.exe`
          
          > ℹ️ **ไม่ต้องติดตั้ง .NET** - โปรแกรมพร้อมใช้งานทันที (Self-contained)
          
          ### 💻 ความต้องการระบบ
          - Windows 10/11 (64-bit)
          - RAM 2 GB ขึ้นไป
          
          ### 📋 ข้อมูลเวอร์ชัน
          - **Version:** ${{ steps.get_version.outputs.VERSION }}
          - **Build:** #${{ github.run_number }}
          
          ---
          📖 [คู่มือการใช้งาน](https://github.com/POBIM/OpenJPDF#readme) | ⭐ ถ้าชอบโปรแกรมนี้ ช่วยกดดาวให้กำลังใจด้วยนะครับ
        files: |
          ./OpenJPDF-win-x64.zip
          ./installer/output/OpenJPDF-Setup-${{ steps.get_version.outputs.VERSION }}.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
